<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vocab Lab · Units 1–5</title>
<style>
:root{
  --ink:#1b2a41; --paper:#f3f5fa; --muted:#5a6a82;
  --u1:#2f6fed; --u2:#12a594; --u3:#e09a00; --u4:#e5484d; --u5:#7c4dff;
  --good:#b8f0cc; --bad:#ffc9cc; --sun:#ffd23f;
  --font: ui-rounded, "SF Pro Rounded", "Avenir Next", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.45 var(--font);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
b{font-weight:800}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--paper);border-bottom:2.5px solid var(--ink)}
.brand{font-weight:800;font-size:20px;letter-spacing:-.02em}
#crumb{display:flex;align-items:center;gap:10px;min-width:0}
.ctitle{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xp{margin-left:auto;border:2.5px solid var(--ink);border-radius:999px;padding:2px 12px;background:var(--sun);font-weight:800;white-space:nowrap}
.xp.pop{animation:pop .35s}
@keyframes pop{40%{transform:scale(1.25) rotate(-3deg)}}
.wrap{max-width:900px;margin:0 auto;padding:18px 16px 70px}
.btn,.back{border:2.5px solid var(--ink);background:#fff;border-radius:12px;padding:9px 16px;font-weight:700;box-shadow:3px 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:active,.back:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.back{padding:5px 12px;box-shadow:2px 2px 0 var(--ink)}
.btn.pri{background:var(--ink);color:#fff}
.btn.good{background:var(--good)}
.btn.bad{background:var(--bad)}
.btn.sm{padding:5px 12px;font-size:15px}
.btn.on{background:var(--sun)}
:focus-visible{outline:3px solid var(--u1);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:12px;margin:16px 0}
.row.c{justify-content:center}
.card{background:#fff;border:2.5px solid var(--ink);border-radius:18px;padding:20px;box-shadow:5px 5px 0 var(--ink);margin:12px 0}
.card.center{text-align:center}
h2{margin:0 0 8px;font-size:26px;letter-spacing:-.02em}
.big{font-size:22px}
.sub{color:var(--muted);margin:6px 0;font-size:15px}
.meter{height:12px;border:2.5px solid var(--ink);border-radius:99px;background:#fff;overflow:hidden}
.meter i{display:block;height:100%;background:var(--u2);transition:width .3s}
.hl{background:var(--sun);padding:0 4px;border-radius:5px}
.ex{color:var(--muted);font-size:16px}

/* home */
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;align-items:center;margin-bottom:8px}
.hero h1{font-size:clamp(32px,6vw,52px);line-height:1.02;margin:0 0 8px;letter-spacing:-.035em}
.hero p{margin:0 0 14px;color:var(--muted)}
.units{display:flex;flex-wrap:wrap;gap:8px}
.uc{border:2.5px solid var(--ink);border-radius:999px;padding:5px 14px;font-weight:800;background:#fff;color:var(--ink);opacity:.55}
.uc.on{background:var(--c);color:#fff;opacity:1;box-shadow:2px 2px 0 var(--ink)}
.uchip{display:inline-block;background:var(--c);color:#fff;border-radius:999px;padding:1px 10px;font-size:13px;font-weight:800}
.wotm{display:block;width:100%;min-height:190px;border:2.5px solid var(--ink);border-radius:22px;background:#fff;box-shadow:6px 6px 0 var(--c);text-align:center;padding:18px;border-color:var(--c)}
.wotm .word{display:block;font-size:clamp(34px,8vw,54px);font-weight:800;color:var(--c);letter-spacing:-.02em}
.wotm .ru{display:block;font-size:26px;font-weight:800}
.wotm .def{display:block;margin-top:6px}
.wotm small{display:block;color:var(--muted);margin-top:8px}
.group{margin:26px 0 6px;font-size:21px;font-weight:800;letter-spacing:-.01em}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.tile{display:flex;flex-direction:column;gap:3px;text-align:left;border:2.5px solid var(--ink);border-radius:16px;padding:14px 16px;background:var(--c);box-shadow:4px 4px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.tile:hover{transform:translate(-1px,-1px);box-shadow:6px 6px 0 var(--ink)}
.tile:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--ink)}
.tile .ic{font-size:28px;line-height:1}
.tile .tt{font-weight:800;font-size:18px}
.tile .ds{font-size:14.5px;color:#33445d}
.tile .tm{font-size:13px;font-weight:700;color:#33445d;margin-top:4px}

/* flash */
.fc{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;width:100%;min-height:290px;border:2.5px solid var(--c);border-radius:22px;background:#fff;box-shadow:6px 6px 0 var(--c);padding:24px;text-align:center;animation:flipIn .25s}
@keyframes flipIn{from{transform:rotateY(70deg);opacity:.4}}
.fc .word{font-size:clamp(40px,11vw,76px);font-weight:800;color:var(--c);letter-spacing:-.03em;line-height:1}
.fc .posl{color:var(--muted)}
.fc .hint{color:var(--muted);font-size:14px}
.fc .ru{font-size:clamp(28px,7vw,44px);font-weight:800}
.fc .def{font-size:19px}

/* options */
.qdef{font-size:22px;margin:0;line-height:1.35}
.qru{font-size:clamp(28px,7vw,44px);font-weight:800;margin:0}
.opts{display:grid;gap:10px;margin-top:12px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{border:2.5px solid var(--ink);background:#fff;border-radius:14px;padding:13px 16px;font-size:20px;font-weight:700;text-align:left;box-shadow:3px 3px 0 var(--ink)}
.opt.right,.tile.right{background:var(--good)}
.opt.wrong{background:var(--bad);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{border:2.5px solid var(--ink);border-radius:14px;padding:12px 14px;margin:12px 0}
.fb.ok{background:var(--good)}.fb.no{background:var(--bad)}.fb.meh{background:var(--sun)}
.hud{display:flex;gap:10px;justify-content:space-between;margin:6px 0 10px}
.hud span{border:2.5px solid var(--ink);border-radius:12px;padding:4px 12px;background:#fff;font-size:18px}
.inp{width:100%;font:inherit;font-size:22px;padding:12px 14px;border:2.5px solid var(--ink);border-radius:12px;margin-top:10px;background:#fff}
.bank{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.bw{border:2px solid var(--ink);border-radius:8px;padding:2px 9px;background:#fff;font-weight:700;font-size:15px}
.bw.used{opacity:.3;text-decoration:line-through}
.hintline{color:var(--muted);min-height:24px;margin:8px 0 0}
.letters{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}
.letters span{width:46px;height:54px;display:grid;place-items:center;border:2.5px solid var(--ink);border-radius:10px;background:var(--sun);font-size:26px;font-weight:800;box-shadow:3px 3px 0 var(--ink);text-transform:uppercase}
.clue{border:2.5px solid var(--ink);border-radius:14px;padding:10px 14px;margin:8px 0;background:#fff;animation:flipIn .25s}
.clue b{color:var(--u1)}
.pts{float:right;font-weight:800;color:var(--u3)}

/* odd one */
.odd{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile.w{align-items:center;justify-content:center;min-height:84px;font-size:24px;font-weight:800;background:#fff;text-align:center}
.tile.wrong{background:var(--bad)}

/* sense */
.sent{font-size:clamp(22px,4.5vw,30px);line-height:1.35;margin:0}

/* memory */
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.mc{aspect-ratio:1/1.05;border:2.5px solid var(--ink);border-radius:14px;background:var(--u1);color:#fff;font-weight:800;font-size:15px;padding:6px;display:grid;place-items:center;box-shadow:3px 3px 0 var(--ink);line-height:1.2;overflow:hidden}
.mc.open{background:#fff;color:var(--ink)}
.mc.done{background:var(--good);color:var(--ink);box-shadow:none}
.mc.q{font-size:30px}

/* match */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cols .opt{width:100%;text-align:center;font-size:18px;padding:11px 8px}
.opt.sel{background:var(--sun)}
.opt.done{background:var(--good);box-shadow:none;opacity:.7}

/* story */
.story{font-size:19px;line-height:2.2;margin:0}
.gp{font:inherit;font-size:16px;font-weight:700;border:2px solid var(--ink);border-radius:8px;padding:2px 4px;background:#fff;max-width:150px}
.gp.ok{background:var(--good)}.gp.no{background:var(--bad)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}

/* dice */
.dw{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:12px 0}
.dw .tile{align-items:center;text-align:center;background:#fff;font-size:26px;font-weight:800;min-height:90px;justify-content:center}
.dw .tile.on{background:var(--good)}
.dw .tile small{font-size:13px;font-weight:600;color:var(--muted)}
.genre{background:var(--u5);color:#fff;border:2.5px solid var(--ink);border-radius:18px;padding:16px 18px;box-shadow:5px 5px 0 var(--ink)}
.genre b{font-size:22px}
.timer{font-size:46px;font-weight:800;text-align:center;letter-spacing:-.02em}

/* board */
.board{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:10px 0}
.bh{font-weight:800;font-size:clamp(11px,2.9vw,16px);text-align:center;display:grid;place-items:center;padding:2px;line-height:1.1}
.bc{border:2.5px solid var(--ink);border-radius:12px;background:var(--u1);color:#fff;font-weight:800;font-size:clamp(18px,5vw,30px);padding:14px 0;box-shadow:3px 3px 0 var(--ink)}
.bc.used{background:#d9dee8;color:#9aa5b8;box-shadow:none}
.modal{position:fixed;inset:0;background:rgba(27,42,65,.6);display:grid;place-items:center;padding:16px;z-index:20}
.modal .card{max-width:620px;width:100%}
.ans{background:var(--good);border:2.5px solid var(--ink);border-radius:12px;padding:10px 14px;margin-top:12px}

/* wyr */
.wyr{font-size:clamp(24px,5vw,34px);font-weight:800;line-height:1.25;letter-spacing:-.01em;margin:0}
.wyr b{background:var(--sun);padding:0 5px;border-radius:6px}

/* plans */
details{border:2.5px solid var(--ink);border-radius:16px;background:#fff;margin:12px 0;box-shadow:4px 4px 0 var(--ink)}
summary{padding:14px 16px;font-weight:800;font-size:19px;cursor:pointer}
details .in{padding:0 16px 14px}
.step{display:grid;grid-template-columns:64px 1fr;gap:10px;padding:8px 0;border-top:1.5px dashed #b9c3d4}
.step .m{font-weight:800;color:var(--u1)}

@media (max-width:640px){
  .hero{grid-template-columns:1fr}
  .opts.two{grid-template-columns:1fr}
  .mgrid{gap:7px}.mc{font-size:12.5px}
  .cols{gap:8px}
  .letters span{width:38px;height:46px;font-size:22px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

/* ============ HELPERS ============ */
const POS={n:'noun',v:'verb',adj:'adjective',adv:'adverb',conj:'conjunction'};
const UC={1:'#2f6fed',2:'#12a594',3:'#e09a00',4:'#e5484d',5:'#7c4dff'};
const WORDS = RAW.trim().split('\n').map(l=>{
  const p=l.split('|'); const m=p[5].match(/\{([^}]+)\}/);
  return {u:+p[0],w:p[1],pos:p[2],ru:p[3],def:p[4],s:p[5],form:m[1]};
});
const ODD = ODD_RAW.trim().split('\n').map(l=>{const p=l.split('|');return {words:p[0].split(','),odd:p[1],why:p[2]};});
const SENSE = SENSE_RAW.trim().split('\n').map(l=>{const p=l.split('|');return {w:p[0],ok:p[1]==='1',s:p[2]};});

const S={units:new Set([1,2,3,4,5]),xp:0,best:0};
const $=s=>document.querySelector(s);
const stage=$('#stage');
let on=()=>{}, onkey=()=>{}, tick=null;

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pick(a,n){return shuffle(a).slice(0,n);}
function pool(){return WORDS.filter(w=>S.units.has(w.u));}
function inPool(word){return pool().some(w=>w.w===word);}
function gapText(w){return esc(w.s).replace(/\{[^}]+\}/,'_____');}
function fullText(w){return esc(w.s).replace(/\{([^}]+)\}/,'<b class="hl">$1</b>');}
function markText(s){return esc(s).replace(/\{([^}]+)\}/,'<b class="hl">$1</b>');}
function unitChip(u){return `<span class="uchip" style="--c:${UC[u]}">Unit ${u}</span>`;}
function firstRu(w){return w.ru.split(';')[0];}
function distract(w,n){
  const p=pool().filter(x=>x!==w);
  const same=shuffle(p.filter(x=>x.pos===w.pos)), rest=shuffle(p.filter(x=>x.pos!==w.pos));
  return same.concat(rest).slice(0,n);
}
function say(t){try{const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}}
function xp(n){S.xp+=n;$('#xp').textContent=S.xp;const b=$('#xpbox');b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop');}
function clearTick(){if(tick){clearInterval(tick);tick=null;}}
function prog(i,n){return `<div class="meter"><i style="width:${i/n*100}%"></i></div><p class="sub">${i+1} из ${n}</p>`;}
function finish(title,text,again){
  stage.innerHTML=`<div class="card center"><h2>${title}</h2><p class="big">${text}</p><div class="row c"><button class="btn pri" data-a="again">Ещё раз</button><button class="btn" data-a="home">В меню</button></div></div>`;
  on=a=>{if(a==='again')again();};
  onkey=()=>{};
}

stage.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]'); if(!b||b.disabled)return;
  const a=b.dataset.a;
  if(a==='home'){go('home');return;}
  on(a,b,e);
});
stage.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.matches('input')){e.preventDefault();onkey(e);}
});
document.addEventListener('click',e=>{const b=e.target.closest('[data-nav]');if(b)go(b.dataset.nav);});

function go(name){
  clearTick(); on=()=>{}; onkey=()=>{};
  const A=ACT[name];
  $('#crumb').innerHTML = name==='home' ? '' : `<button class="back" data-nav="home">← Меню</button><span class="ctitle">${A.title}</span>`;
  A.start();
  window.scrollTo(0,0);
}

    else if(a==='more'){deck.push(deck.shift());back=false;draw();}
  };
  draw();
}};

/* ---- definition quiz ---- */
ACT.quiz={title:'Угадай по определению',start(){
  const qs=pick(pool(),10);let i=0,score=0,ans=false,opts=[];
  const draw=()=>{
    if(i>=qs.length)return finish('Раунд окончен',`${score} из ${qs.length}`,ACT.quiz.start);
    ans=false;const w=qs[i];opts=shuffle([w,...distract(w,3)]);
    stage.innerHTML=prog(i,qs.length)+`<div class="card"><p class="qdef">${esc(w.def)}</p></div>
      <div class="opts">${opts.map((o,k)=>`<button class="opt" data-a="opt" data-k="${k}">${esc(o.w)}</button>`).join('')}</div><div id="fb"></div>`;
  };
  on=(a,b)=>{
    if(a==='opt'&&!ans){
      ans=true;const w=qs[i];const ok=opts[+b.dataset.k]===w;
      stage.querySelectorAll('.opt').forEach((e,k)=>{if(opts[k]===w)e.classList.add('right');else if(e===b)e.classList.add('wrong');e.disabled=true;});
      if(ok){score++;xp(2);}
      $('#fb').innerHTML=`<div class="fb ${ok?'ok':'no'}"><b>${ok?'Верно!':'Не совсем.'}</b> ${esc(w.w)} — ${esc(w.ru)}<br><span class="ex">${fullText(w)}</span></div><button class="btn pri" data-a="next">Дальше</button>`;
    }else if(a==='next'){i++;draw();}
  };
  draw();
}};

/* ---- blitz ---- */
ACT.blitz={title:'Блиц 60 секунд',start(){
  stage.innerHTML=`<div class="card center"><h2>Блиц: русский → английский</h2><p>60 секунд. Выбирай правильный перевод как можно быстрее. Рекорд: ${S.best}</p><button class="btn pri" data-a="go">Старт</button></div>`;
  on=a=>{if(a==='go')run();};
  function run(){
    let t=60,score=0,streak=0,w,opts,lock=false,over=false;
    const draw=()=>{
      if(over)return;lock=false;w=pick(pool(),1)[0];opts=shuffle([w,...distract(w,3)]);
      stage.innerHTML=`<div class="hud"><span>⏱ <b id="t">${t}</b></span><span>Очки <b>${score}</b></span><span>Серия <b>${streak}</b></span></div>
        <div class="card center"><p class="qru">${esc(w.ru)}</p></div>
        <div class="opts two">${opts.map((o,k)=>`<button class="opt" data-a="opt" data-k="${k}">${esc(o.w)}</button>`).join('')}</div>`;
    };
    on=(a,b)=>{
      if(a!=='opt'||lock||over)return;lock=true;
      const ok=opts[+b.dataset.k]===w;
      if(ok){score++;streak++;xp(1);b.classList.add('right');setTimeout(draw,250);}
      else{streak=0;b.classList.add('wrong');stage.querySelectorAll('.opt').forEach((e,k)=>{if(opts[k]===w)e.classList.add('right');});setTimeout(draw,850);}
    };
    draw();
    tick=setInterval(()=>{
      t--;const el=$('#t');if(el)el.textContent=t;
      if(t<=0){clearTick();over=true;const nb=score>S.best;if(nb)S.best=score;
        finish('Время вышло!',`Результат: ${score}${nb?' — новый рекорд!':' · рекорд '+S.best}`,ACT.blitz.start);}
    },1000);
  }
}};

/* ---- fill the gap ---- */
ACT.gap={title:'Вставь слово',start(){
  const qs=pick(pool(),10);let i=0,score=0,hint=0,done=false;
  const bank=shuffle(qs.map(q=>q.w));
  const draw=()=>{
    if(i>=qs.length)return finish('Раунд окончен',`${score} из ${qs.length}`,ACT.gap.start);
    const w=qs[i];hint=0;done=false;
    const usedWords=qs.slice(0,i).map(q=>q.w);
    stage.innerHTML=prog(i,qs.length)+`<div class="bank">${bank.map(b=>`<span class="bw ${usedWords.includes(b)?'used':''}">${esc(b)}</span>`).join('')}</div>
      <div class="card"><p class="qdef">${gapText(w)}</p><p class="hintline" id="hl"></p></div>
      <input class="inp" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Слово в нужной форме">
      <div class="row"><button class="btn" data-a="hint">Подсказка</button><button class="btn" data-a="skip">Не знаю</button><button class="btn pri" data-a="check">Проверить</button></div><div id="fb"></div>`;
    $('#ans').focus();
  };
  const reveal=ok=>{
    const w=qs[i];done=true;$('#ans').disabled=true;
    $('#fb').innerHTML=`<div class="fb ${ok?'ok':'no'}"><b>${ok?'Верно!':'Правильный ответ: '+esc(w.form)}</b><br>${fullText(w)}<br><span class="ex">${esc(w.w)} — ${esc(w.ru)}</span></div><button class="btn pri" data-a="next">Дальше</button>`;
  };
  const check=()=>{
    if(done)return;const w=qs[i];const v=$('#ans').value.trim().toLowerCase();if(!v)return;
    if(v===w.form.toLowerCase()){score++;xp(hint?1:3);reveal(true);}
    else if(v===w.w.toLowerCase()){$('#fb').innerHTML='<div class="fb meh">Почти! Слово верное, но нужно изменить форму, чтобы оно подошло к предложению.</div>';}
    else{$('#fb').innerHTML='<div class="fb no">Пока нет. Попробуй ещё раз или возьми подсказку.</div>';}
  };
  on=a=>{
    if(a==='check')check();
    else if(a==='hint'&&!done){const w=qs[i];hint=Math.min(hint+1,w.form.length);$('#hl').textContent='Подсказка: '+w.form.slice(0,hint)+' _'.repeat(w.form.length-hint);}
    else if(a==='skip'&&!done)reveal(false);
    else if(a==='next'){i++;draw();}
  };
  onkey=()=>{if(done){i++;draw();}else check();};
  draw();
}};

/* ---- scramble ---- */
function scr(word){
  const a=word.split('');if(new Set(a).size<2)return word;
  let s;do{s=shuffle(a).join('');}while(s===word);return s;
}
ACT.scramble={title:'Анаграммы',start(){
  const qs=pick(pool().filter(w=>w.w.length>=4),10);let i=0,score=0,done=false,sc='';
  const draw=()=>{
    if(i>=qs.length)return finish('Раунд окончен',`${score} из ${qs.length}`,ACT.scramble.start);
    const w=qs[i];done=false;sc=scr(w.w);
    stage.innerHTML=prog(i,qs.length)+`<div class="card center"><div class="letters">${sc.split('').map(c=>`<span>${esc(c)}</span>`).join('')}</div>
      <p class="qdef">${esc(w.def)}</p><p class="hintline" id="hl"></p></div>
      <input class="inp" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Какое это слово?">
      <div class="row"><button class="btn" data-a="ru">Подсказка по-русски</button><button class="btn" data-a="skip">Не знаю</button><button class="btn pri" data-a="check">Проверить</button></div><div id="fb"></div>`;
    $('#ans').focus();
  };
  const reveal=ok=>{
    const w=qs[i];done=true;$('#ans').disabled=true;
    $('#fb').innerHTML=`<div class="fb ${ok?'ok':'no'}"><b>${ok?'Верно!':'Это было слово: '+esc(w.w)}</b><br>${fullText(w)}</div><button class="btn pri" data-a="next">Дальше</button>`;
  };
  const check=()=>{
    if(done)return;const w=qs[i];const v=$('#ans').value.trim().toLowerCase();if(!v)return;
    if(v===w.w){score++;xp(2);reveal(true);}else $('#fb').innerHTML='<div class="fb no">Не то слово. Попробуй ещё раз.</div>';
  };
  on=a=>{
    if(a==='check')check();
    else if(a==='ru'&&!done){$('#hl').textContent='По-русски: '+firstRu(qs[i]);}
    else if(a==='skip'&&!done)reveal(false);
    else if(a==='next'){i++;draw();}
  };
  onkey=()=>{if(done){i++;draw();}else check();};
  draw();
}};

/* ---- detective ---- */
ACT.detective={title:'Слово-детектив',start(){
  const qs=pick(pool(),5);let i=0,score=0,k=0,done=false;
  const clues=w=>[
    `Часть речи: <b>${POS[w.pos]}</b>. Букв: <b>${w.w.length}</b>. Юнит: <b>${w.u}</b>`,
    `Первая буква: <b>${esc(w.w[0])}</b>${' _'.repeat(w.w.length-1)}`,
    `Определение: <b>${esc(w.def)}</b>`,
    `Предложение: <b>${gapText(w)}</b>`,
    `По-русски: <b>${esc(w.ru)}</b>`
  ];
  const draw=()=>{
    if(i>=qs.length)return finish('Все дела раскрыты',`Очков: ${score} из ${qs.length*5}`,ACT.detective.start);
    k=0;done=false;
    stage.innerHTML=prog(i,qs.length)+`<div class="card"><h2>Кто скрывается за этим словом?</h2><div id="cl"></div></div>
      <input class="inp" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Твоя версия">
      <div class="row"><button class="btn" data-a="clue">Следующая подсказка</button><button class="btn pri" data-a="check">Проверить</button></div><div id="fb"></div>`;
    paint();$('#ans').focus();
  };
  const paint=()=>{
    const c=clues(qs[i]);
    $('#cl').innerHTML=c.slice(0,k+1).map((t,j)=>`<div class="clue"><span class="pts">${5-j} очк.</span>${t}</div>`).join('');
  };
  const end=ok=>{
    const w=qs[i];done=true;$('#ans').disabled=true;
    if(ok){score+=5-k;xp(5-k);}
    $('#fb').innerHTML=`<div class="fb ${ok?'ok':'no'}"><b>${ok?'Раскрыто! +'+(5-k):'Дело не раскрыто.'}</b> Это слово: <b>${esc(w.w)}</b><br>${fullText(w)}</div><button class="btn pri" data-a="next">Дальше</button>`;
  };
  const check=()=>{
    if(done)return;const w=qs[i];const v=$('#ans').value.trim().toLowerCase();if(!v)return;
    if(v===w.w)end(true);
    else if(k<4){k++;paint();$('#ans').value='';$('#fb').innerHTML='<div class="fb no">Не угадал. Вот новая подсказка.</div>';}
    else end(false);
  };
  on=a=>{
    if(a==='check')check();
    else if(a==='clue'&&!done){if(k<4){k++;paint();}else end(false);}
    else if(a==='next'){i++;draw();}
  };
  onkey=()=>{if(done){i++;draw();}else check();};
  draw();
}};

/* ---- odd one out ---- */
function oddPool(){
  const e=ODD.filter(s=>s.words.filter(inPool).length>=3);
  return e.length>=4?e:ODD;
}
ACT.odd={title:'Лишнее слово',start(){
  const qs=pick(oddPool(),8);let i=0,score=0,ans=false,ws=[];
  const draw=()=>{
    if(i>=qs.length)return finish('Раунд окончен',`${score} из ${qs.length}`,ACT.odd.start);
    ans=false;const q=qs[i];ws=shuffle(q.words);
    stage.innerHTML=prog(i,qs.length)+`<p class="sub">Какое слово лишнее? Потом объясни почему, по-английски.</p>
      <div class="odd">${ws.map((w,k)=>`<button class="tile w" data-a="pick" data-k="${k}">${esc(w)}</button>`).join('')}</div><div id="fb"></div>`;
  };
  on=(a,b)=>{
    if(a==='pick'&&!ans){
      ans=true;const q=qs[i];const w=ws[+b.dataset.k];const ok=w===q.odd;
      stage.querySelectorAll('.tile.w').forEach((e,k)=>{if(ws[k]===q.odd)e.classList.add('right');else if(e===b)e.classList.add('wrong');e.disabled=true;});
      if(ok){score++;xp(2);}
      $('#fb').innerHTML=`<div class="fb ${ok?'ok':'no'}"><b>${ok?'Верно!':'Лишнее слово: '+esc(q.odd)}</b><br>${esc(q.why)}<br><span class="ex">Скажи: «${esc(q.odd)} is the odd one because…»</span></div><button class="btn pri" data-a="next">Дальше</button>`;
    }else if(a==='next'){i++;draw();}
  };
  draw();
}};

/* ---- sense or nonsense ---- */
ACT.sense={title:'Есть смысл или нет?',start(){
  let src=SENSE.filter(x=>inPool(x.w));if(src.length<8)src=SENSE;
  const qs=pick(src,10);let i=0,score=0,ans=false;
  const draw=()=>{
    if(i>=qs.length)return finish('Раунд окончен',`${score} из ${qs.length}`,ACT.sense.start);
    ans=false;const q=qs[i];
    stage.innerHTML=prog(i,qs.length)+`<div class="card"><p class="sent">${markText(q.s)}</p></div>
      <div class="opts two"><button class="opt" data-a="yes">✓ Есть смысл</button><button class="opt" data-a="no">✗ Чепуха</button></div><div id="fb"></div>`;
  };
  on=a=>{
    if((a==='yes'||a==='no')&&!ans){
      ans=true;const q=qs[i];const ok=(a==='yes')===q.ok;
      stage.querySelectorAll('.opt').forEach(e=>e.disabled=true);
      if(ok){score++;xp(2);}
      $('#fb').innerHTML=`<div class="fb ${ok?'ok':'no'}"><b>${ok?'Верно!':'Не совсем.'}</b> ${q.ok?'Предложение логичное.':'Здесь слово использовано неправильно или предложение нелогично.'}${q.ok?'':'<br><span class="ex">Исправь предложение вслух, чтобы оно стало правильным.</span>'}</div><button class="btn pri" data-a="next">Дальше</button>`;
    }else if(a==='next'){i++;draw();}
  };
  draw();
}};

/* ---- memory pairs ---- */
ACT.pairs={title:'Найди пару',start(mode){
  mode=mode||'ru';
  const ws=pick(pool(),8);
  let cards=[];
  ws.forEach((w,k)=>{cards.push({k,t:w.w,o:false,d:false});cards.push({k,t:mode==='ru'?firstRu(w):w.def,o:false,d:false});});
  cards=shuffle(cards);
  let first=-1,lock=false,found=0,moves=0;
  const draw=()=>{
    stage.innerHTML=`<div class="row" style="margin-top:0"><button class="btn sm ${mode==='ru'?'on':''}" data-a="m-ru">Слово — перевод</button><button class="btn sm ${mode==='def'?'on':''}" data-a="m-def">Слово — определение</button></div>
     <p class="sub">Ходов: ${moves} · найдено пар: ${found} из 8</p>
     <div class="mgrid">${cards.map((c,i)=>`<button class="mc ${c.d?'done':c.o?'open':'q'}" data-a="card" data-i="${i}">${c.d||c.o?esc(c.t):'?'}</button>`).join('')}</div>
     ${found===8?`<div class="fb ok"><b>Все пары найдены за ${moves} ходов!</b></div><div class="row"><button class="btn pri" data-a="m-${mode}">Ещё раз</button></div>`:''}`;
  };
  on=(a,b)=>{
    if(a==='m-ru')return ACT.pairs.start('ru');
    if(a==='m-def')return ACT.pairs.start('def');
    if(a!=='card'||lock)return;
    const i=+b.dataset.i,c=cards[i];if(c.o||c.d)return;
    c.o=true;
    if(first<0){first=i;draw();return;}
    moves++;const f=cards[first];
    if(f.k===c.k){f.d=c.d=true;f.o=c.o=false;found++;first=-1;xp(2);draw();}
    else{lock=true;draw();setTimeout(()=>{f.o=c.o=false;first=-1;lock=false;draw();},1000);}
  };
  draw();
}};

/* ---- synonyms / opposites ---- */
ACT.match={title:'Синонимы и противоположности',start(kind){
  kind=kind||'s';
  let bank=PAIRS.filter(p=>p[2]===kind);
  const ip=bank.filter(p=>inPool(p[0]));if(ip.length>=6)bank=ip;
  const ps=pick(bank,6);
  const right=shuffle(ps.map((p,i)=>({i,t:p[1]})));
  let sel=-1,solved=new Set(),mist=0;
  const draw=()=>{
    stage.innerHTML=`<div class="row" style="margin-top:0"><button class="btn sm ${kind==='s'?'on':''}" data-a="k-s">Синонимы (=)</button><button class="btn sm ${kind==='o'?'on':''}" data-a="k-o">Противоположности (≠)</button></div>
     <p class="sub">${kind==='s'?'Найди слово с близким значением':'Найди слово с противоположным значением'} · ошибок: ${mist}</p>
     <div class="cols"><div class="opts">${ps.map((p,i)=>`<button class="opt ${solved.has(i)?'done':sel===i?'sel':''}" data-a="l" data-i="${i}">${esc(p[0])}</button>`).join('')}</div>
     <div class="opts">${right.map((r,j)=>`<button class="opt ${solved.has(r.i)?'done':''}" data-a="r" data-j="${j}">${esc(r.t)}</button>`).join('')}</div></div>
     ${solved.size===ps.length?`<div class="fb ok"><b>Раунд пройден!</b></div><div class="row"><button class="btn pri" data-a="k-${kind}">Ещё раунд</button></div>`:''}`;
  };
  on=(a,b)=>{
    if(a==='k-s')return ACT.match.start('s');
    if(a==='k-o')return ACT.match.start('o');
    if(a==='l'){const i=+b.dataset.i;if(solved.has(i))return;sel=i;draw();}
    else if(a==='r'&&sel>=0){
      const j=+b.dataset.j,r=right[j];
      if(solved.has(r.i))return;
      if(r.i===sel){solved.add(sel);sel=-1;xp(1);draw();}
      else{mist++;b.classList.add('wrong');setTimeout(draw,450);}
    }
  };
  draw();
}};

/* ---- stories ---- */
ACT.story={title:'Рассказ с пропусками',start(n){
  if(n===undefined){const sel=STORIES.findIndex(s=>S.units.has(s.u));n=sel<0?0:sel;}
  const st=STORIES[n];
  const gaps=[...st.t.matchAll(/\[\[([^\]]+)\]\]/g)].map(m=>m[1]);
  const opts=shuffle([...new Set(gaps)]);
  const html=esc(st.t).replace(/\[\[([^\]]+)\]\]/g,(m,a)=>`<select class="gp" data-ans="${esc(a)}"><option value="">…</option>${opts.map(o=>`<option>${esc(o)}</option>`).join('')}</select>`);
  stage.innerHTML=`<div class="tabs">${STORIES.map((s,i)=>`<button class="btn sm ${i===n?'on':''}" data-a="tab" data-i="${i}">Unit ${s.u}</button>`).join('')}</div>
    <div class="card"><h2>${esc(st.title)} ${unitChip(st.u)}</h2><p class="story">${html}</p></div>
    <div class="row"><button class="btn pri" data-a="check">Проверить</button><button class="btn" data-a="show">Показать ответы</button></div><div id="fb"></div>`;
  on=a=>{
    if(a==='tab')return ACT.story.start(+arguments[1].dataset.i);
    const sels=[...stage.querySelectorAll('.gp')];
    if(a==='check'){
      let ok=0;sels.forEach(s=>{const r=s.value===s.dataset.ans;s.classList.toggle('ok',r);s.classList.toggle('no',!r);if(r)ok++;});
      if(ok===sels.length)xp(8);
      $('#fb').innerHTML=`<div class="fb ${ok===sels.length?'ok':'meh'}"><b>Правильно: ${ok} из ${sels.length}.</b> ${ok===sels.length?'Теперь перескажи историю своими словами, пять предложений.':'Красные пропуски можно исправить и проверить ещё раз.'}</div>`;
    }else if(a==='show'){sels.forEach(s=>{s.value=s.dataset.ans;s.classList.add('ok');s.classList.remove('no');});}
  };
}};
</script>
<script>
/* tab handler needs the clicked element, so wrap story's handler */
(function(){
  const orig=ACT.story.start;
  ACT.story.start=function(n){
    orig.call(this,n);
    const h=on;
    on=function(a,b){ if(a==='tab'){ACT.story.start(+b.dataset.i);return;} h(a,b); };
  };
})();

/* ---- story dice ---- */
ACT.dice={title:'Кубики историй',start(n){
  n=n||3;
  const ws=pick(pool(),n),g=pick(GENRES,1)[0];
  const used=new Set();let t=60,running=false,rewarded=false;
  const draw=()=>{
    stage.innerHTML=`<div class="genre"><b>${esc(g[0])}</b><br>${esc(g[1])}</div>
     <p class="sub">Расскажи историю и используй все слова. Нажимай на слово, когда оно прозвучало.</p>
     <div class="dw">${ws.map((w,i)=>`<button class="tile ${used.has(i)?'on':''}" data-a="use" data-i="${i}">${esc(w.w)}<small>${esc(firstRu(w))}</small></button>`).join('')}</div>
     <div class="timer" id="tm">${t}</div>
     <div class="row c"><button class="btn pri" data-a="timer">${running?'Стоп':'Таймер 60 сек'}</button><button class="btn" data-a="roll">Бросить снова</button><button class="btn" data-a="hard">${n===3?'Сложнее: 4 слова':'Обычный: 3 слова'}</button></div>
     ${used.size===ws.length?'<div class="fb ok"><b>Все слова использованы! Отличная история.</b></div>':''}`;
  };
  on=(a,b)=>{
    if(a==='use'){const i=+b.dataset.i;used.has(i)?used.delete(i):used.add(i);if(used.size===ws.length&&!rewarded){rewarded=true;xp(5);}draw();}
    else if(a==='timer'){
      if(running){clearTick();running=false;draw();}
      else{running=true;t=60;draw();tick=setInterval(()=>{t--;const el=$('#tm');if(el)el.textContent=t;if(t<=0){clearTick();running=false;draw();}},1000);}
    }
    else if(a==='roll')ACT.dice.start(n);
    else if(a==='hard')ACT.dice.start(n===3?4:3);
  };
  draw();
}};

/* ---- would you rather ---- */
ACT.wyr={title:'Что выберешь?',start(){
  const qs=shuffle(WYR);let i=0;
  const draw=()=>{
    stage.innerHTML=`<p class="sub">${i+1} из ${qs.length}</p><div class="card"><p class="wyr">${qs[i]}</p></div>
      <p class="sub">Выбери вариант и объясни: «I would rather… because…». Репетитор тоже отвечает, а потом задаёт вопрос «Why?».</p>
      <div class="row"><button class="btn pri" data-a="next">${i<qs.length-1?'Следующий вопрос':'Ещё раз'}</button></div>`;
  };
  on=a=>{if(a==='next'){i++;if(i>=qs.length){qs.splice(0,qs.length,...shuffle(WYR));i=0;}xp(1);draw();}};
  draw();
}};

/* ---- quiz show ---- */
ACT.show={title:'Своя игра',start(){
  const ws=shuffle(pool());let wi=0;const nextW=()=>ws[(wi++)%ws.length];
  const sets=shuffle(oddPool());let si=0;const nextS=()=>sets[(si++)%sets.length];
  const cats=[
    {n:'Определение',mk:()=>{const w=nextW();return {q:`Какое это слово?<br><i>${esc(w.def)}</i>`,a:`<b>${esc(w.w)}</b>`};}},
    {n:'Перевод',mk:()=>{const w=nextW();return {q:`Как по-английски: <b>${esc(w.ru)}</b>?`,a:`<b>${esc(w.w)}</b>`};}},
    {n:'Пропуск',mk:()=>{const w=nextW();return {q:gapText(w),a:`<b>${esc(w.form)}</b> (${esc(w.w)})`};}},
    {n:'Лишнее',mk:()=>{const s=nextS();return {q:shuffle(s.words).map(esc).join(' · '),a:`<b>${esc(s.odd)}</b>. ${esc(s.why)}`};}},
    {n:'Предложение',mk:()=>{const w=nextW();return {q:`Придумай предложение со словом <b>${esc(w.w)}</b>`,a:`Например: ${fullText(w)}`};}}
  ];
  const board=cats.map(c=>[1,2,3,4].map(v=>Object.assign({v:v*100,used:false},c.mk())));
  const sc={st:0,tu:0};let cur=null;
  const left=()=>board.reduce((n,col)=>n+col.filter(x=>!x.used).length,0);
  const draw=()=>{
    stage.innerHTML=`<div class="hud"><span>Ученик <b>${sc.st}</b></span><span>${left()?'Осталось: '+left():'Игра окончена'}</span><span>Репетитор <b>${sc.tu}</b></span></div>
     <div class="board">${cats.map(c=>`<div class="bh">${c.n}</div>`).join('')}${[0,1,2,3].map(r=>cats.map((c,ci)=>{const x=board[ci][r];return `<button class="bc ${x.used?'used':''}" data-a="cell" data-c="${ci}" data-r="${r}" ${x.used?'disabled':''}>${x.v}</button>`;}).join('')).join('')}</div>
     ${left()?'':`<div class="fb ok"><b>${sc.st>sc.tu?'Победил ученик!':sc.st<sc.tu?'Победил репетитор!':'Ничья!'}</b></div>`}
     <div class="row"><button class="btn" data-a="new">Новая доска</button></div>`;
  };
  on=(a,b)=>{
    if(a==='cell'){
      cur=board[+b.dataset.c][+b.dataset.r];
      stage.insertAdjacentHTML('beforeend',`<div class="modal" id="md"><div class="card"><p class="sub">${cats[+b.dataset.c].n} · ${cur.v}</p><p class="qdef">${cur.q}</p>
        <div id="ansbox"><button class="btn" data-a="reveal">Показать ответ</button></div>
        <div class="row" id="award" style="display:none"><button class="btn good" data-a="aw" data-w="st">Ученик +${cur.v}</button><button class="btn good" data-a="aw" data-w="tu">Репетитор +${cur.v}</button><button class="btn" data-a="aw" data-w="no">Никто</button></div></div></div>`);
    }else if(a==='reveal'){
      $('#ansbox').innerHTML=`<div class="ans">${cur.a}</div>`;$('#award').style.display='flex';
    }else if(a==='aw'){
      cur.used=true;const w=b.dataset.w;
      if(w==='st'){sc.st+=cur.v;xp(cur.v/100);}else if(w==='tu')sc.tu+=cur.v;
      $('#md').remove();draw();
    }else if(a==='new')ACT.show.start();
  };
  draw();
}};

/* ---- plans ---- */
ACT.plans={title:'Планы занятий',start(){
  stage.innerHTML=`<p class="sub">Каждый план собран из заданий этого приложения. Меняй порядок и время под ученика.</p>
   ${PLANS.map((p,i)=>`<details ${i===0?'open':''}><summary>${esc(p.t)}</summary><div class="in"><p class="sub">${esc(p.s)}</p>${p.st.map(s=>`<div class="step"><span class="m">${esc(s[0])}</span><span><b>${esc(s[1])}.</b> ${esc(s[2])}</span></div>`).join('')}</div></details>`).join('')}
   <details><summary>Домашнее задание и повторение через интервалы</summary><div class="in">
     <div class="step"><span class="m">Идея</span><span><b>Голосовое на минуту.</b> Ученик записывает историю минимум с пятью словами юнита и присылает вам.</span></div>
     <div class="step"><span class="m">Идея</span><span><b>Свои карточки.</b> Десять слов, которые давались хуже всего: слово, пример, рисунок или перевод.</span></div>
     <div class="step"><span class="m">Идея</span><span><b>Охота за словами.</b> Найти три слова юнита в песне, сериале или тексте и принести пример.</span></div>
     <div class="step"><span class="m">Режим</span><span><b>Интервалы.</b> Возвращайтесь к словам через день, через три дня и через неделю. Короткий повтор по 5 минут работает лучше, чем один длинный.</span></div>
   </div></details>`;
}};

/* ============ START ============ */
go('home');
</script>
</body>
